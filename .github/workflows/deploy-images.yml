name: Deploy images

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: vars
        run: |
          echo "tag=deploy-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/weknora-ui:${{ steps.vars.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.tag }}
          build-args: |
            VITE_FRONTEND_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=tapsvc-ui
          cache-to: type=gha,scope=tapsvc-ui,mode=max

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: vars
        run: |
          echo "tag=deploy-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.app
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/weknora-app:${{ steps.vars.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.tag }}
          build-args: |
            VERSION_ARG=${{ steps.vars.outputs.tag }}
            COMMIT_ID_ARG=${{ github.sha }}
            BUILD_TIME_ARG=${{ steps.vars.outputs.build_time }}
            WITH_ANYDOC=1
          cache-from: type=gha,scope=tapsvc-app
          cache-to: type=gha,scope=tapsvc-app,mode=max

  docreader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: vars
        run: |
          echo "tag=deploy-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.docreader
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/weknora-docreader:${{ steps.vars.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.tag }}
          build-args: |
            VERSION_ARG=${{ steps.vars.outputs.tag }}
            COMMIT_ID_ARG=${{ github.sha }}
          cache-from: type=gha,scope=tapsvc-docreader
          cache-to: type=gha,scope=tapsvc-docreader,mode=max

  neo4j:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: vars
        run: echo "tag=deploy-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./deployment/tapsvc/neo4j
          file: ./deployment/tapsvc/neo4j/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/weknora-neo4j:${{ steps.vars.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=tapsvc-neo4j
          cache-to: type=gha,scope=tapsvc-neo4j,mode=max

